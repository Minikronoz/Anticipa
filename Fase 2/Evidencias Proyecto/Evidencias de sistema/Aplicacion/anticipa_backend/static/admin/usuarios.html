<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Usuarios - Anticipa Admin</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">

    <link rel="stylesheet" href="styles.css">

</head>

<body>

<div class="wrapper">

    <!-- SIDEBAR -->

<div id="sidebarContainer"></div>

    <!-- MAIN -->

    <main class="main-content">

        <div class="page-header">

            <div>

                <h2>Gestión de Usuarios</h2>

                <p class="text-muted">
                    Administración completa de usuarios registrados
                </p>

            </div>

            <button
                class="btn btn-primary"
                data-bs-toggle="modal"
                data-bs-target="#modalCrear">

                <i class="fas fa-user-plus"></i>
                Nuevo Usuario

            </button>

        </div>

        <!-- MÉTRICAS -->

        <div class="row g-4 mb-4">

            <div class="col-md-3">
                <div class="metric-card">
                    <h3 id="totalUsuarios">0</h3>
                    <span>Total Usuarios</span>
                </div>
            </div>

            <div class="col-md-3">
                <div class="metric-card">
                    <h3 id="totalEstudiantes">0</h3>
                    <span>Estudiantes</span>
                </div>
            </div>

            <div class="col-md-3">
                <div class="metric-card">
                    <h3 id="totalProfesores">0</h3>
                    <span>Profesores</span>
                </div>
            </div>

            <div class="col-md-3">
                <div class="metric-card">
                    <h3 id="totalTutores">0</h3>
                    <span>Tutores</span>
                </div>
            </div>

        </div>

        <!-- TABLA -->

        <div class="card shadow-sm border-0">

            <div class="card-header bg-white">

                <div class="row align-items-center">

                    <div class="col-md-6">

                        <h5 class="mb-0">
                            Usuarios Registrados
                        </h5>

                    </div>

                    <div class="col-md-6">

                        <input
                            type="text"
                            id="buscar"
                            class="form-control"
                            placeholder="Buscar usuario..."
                            onkeyup="filtrarUsuarios()">

                    </div>

                </div>

            </div>

            <div class="card-body">

                <div class="table-responsive">

                    <table class="table table-hover align-middle">

                        <thead>

                            <tr>
                                <th>Nombre</th>
                                <th>Email</th>
                                <th>Rol</th>
                                <th>Acciones</th>
                            </tr>

                        </thead>

                        <tbody id="tablaUsuarios">

                        </tbody>

                    </table>

                </div>

            </div>

        </div>

    </main>

</div>

<!-- MODAL CREAR -->

<div class="modal fade" id="modalCrear">

    <div class="modal-dialog">

        <div class="modal-content">

            <div class="modal-header">

                <h5>Crear Usuario</h5>

                <button
                    type="button"
                    class="btn-close"
                    data-bs-dismiss="modal">
                </button>

            </div>

            <div class="modal-body">

                <div class="mb-3">
                    <label>Nombre</label>
                    <input type="text" id="nuevoNombre" class="form-control">
                </div>

                <div class="mb-3">
                    <label>Email</label>
                    <div class="input-group">
                        <input type="text" id="nuevoEmail" class="form-control" placeholder="nombre.apellido">
                        <span class="input-group-text" id="dominioPreview">@gmail.com</span>
                    </div>
                </div>

                <div class="mb-3">
                    <label>Dominio</label>
                    <select id="nuevoDominio" class="form-select">
                        <option value="@gmail.com">@gmail.com (Apoderado)</option>
                        <option value="@outlook.com">@outlook.com (Apoderado)</option>
                        <option value="@profesor.cl">@profesor.cl</option>
                        <option value="@estudiante.cl">@estudiante.cl</option>
                        <option value="@duocuc.cl">@duocuc.cl</option>
                    </select>
                </div>

                <div class="mb-3">
                    <label>Contraseña</label>
                    <input type="password" id="nuevoPassword" class="form-control">
                </div>

                <div class="mb-3">

                    <label>Rol</label>

                    <select id="nuevoRol" class="form-select">

                        <option value="1">Administrador</option>
                        <option value="2">Profesor</option>
                        <option value="3">Tutor</option>
                        <option value="4">Estudiante</option>

                    </select>

                </div>

            </div>

            <div class="modal-footer">

                <button
                    class="btn btn-secondary"
                    data-bs-dismiss="modal">

                    Cancelar

                </button>

                <button
                    class="btn btn-primary"
                    onclick="crearUsuario()">

                    Crear Usuario

                </button>

            </div>

        </div>

    </div>

</div>

<!-- MODAL EDITAR -->

<div class="modal fade" id="modalEditar">

    <div class="modal-dialog">

        <div class="modal-content">

            <div class="modal-header">

                <h5 class="modal-title">
                    Editar Usuario
                </h5>

                <button
                    type="button"
                    class="btn-close"
                    data-bs-dismiss="modal">
                </button>

            </div>

            <div class="modal-body">

                <input type="hidden" id="editId">

                <div class="mb-3">
                    <label>Nombre</label>
                    <input type="text" id="editNombre" class="form-control">
                </div>

                <div class="mb-3">
                    <label>Email</label>
                    <input type="email" id="editEmail" class="form-control">
                </div>

                <div class="mb-3">

                    <label>Rol</label>

                    <select id="editRol" class="form-select">

                        <option value="1">Administrador</option>
                        <option value="2">Profesor</option>
                        <option value="3">Tutor</option>
                        <option value="4">Estudiante</option>

                    </select>

                </div>

                <div class="form-check mb-3">

                    <input
                        type="checkbox"
                        id="editAdmin"
                        class="form-check-input">

                    <label class="form-check-label">
                        Es administrador
                    </label>

                </div>

                <div class="mb-3">

                    <label>Nueva contraseña</label>

                    <input
                        type="password"
                        id="editPassword"
                        class="form-control">

                </div>

            </div>

            <div class="modal-footer">

                <button
                    class="btn btn-secondary"
                    data-bs-dismiss="modal">

                    Cancelar

                </button>

                <button
                    class="btn btn-primary"
                    onclick="guardarUsuario()">

                    Guardar

                </button>

            </div>

        </div>

    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="usuarios.js"></script>
<script src="sidebar.js"></script>
</body>
</html>
