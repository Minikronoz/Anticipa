<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Reportes | Anticipa</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">

<link rel="stylesheet" href="styles.css">

</head>

<body>

<div class="wrapper">

<div id="sidebarContainer"></div>

    <main class="main-content">

        <div class="page-header">

            <div>

                <h2>Reportes Inteligentes</h2>

                <p class="text-muted">
                    Métricas avanzadas para toma de decisiones
                </p>

            </div>

        </div>

        <!-- KPI -->

        <div class="row g-4">

            <div class="col-md-3">
                <div class="dashboard-card card">
                    <div class="card-body">
                        <h2 id="mejoraGlobal">0%</h2>
                        <span>Mejora Global</span>
                    </div>
                </div>
            </div>

            <div class="col-md-3">
                <div class="dashboard-card card">
                    <div class="card-body">
                        <h2 id="riesgoAlto">0</h2>
                        <span>Riesgo Alto</span>
                    </div>
                </div>
            </div>

            <div class="col-md-3">
                <div class="dashboard-card card">
                    <div class="card-body">
                        <h2 id="factorPrincipal">-</h2>
                        <span>Factor Principal</span>
                    </div>
                </div>
            </div>

            <div class="col-md-3">
                <div class="dashboard-card card">
                    <div class="card-body">
                        <h2 id="cursoCritico">-</h2>
                        <span>Curso Crítico</span>
                    </div>
                </div>
            </div>

        </div>

        <!-- GRAFICOS -->

        <div class="row mt-4">

            <div class="col-lg-6">

                <div class="card">

                    <div class="card-header">
                        Evolución General
                    </div>

                    <div class="card-body">

                        <canvas id="graficoEvolucion"></canvas>

                    </div>

                </div>

            </div>

            <div class="col-lg-6">

                <div class="card">

                    <div class="card-header">
                        Factores Desencadenantes
                    </div>

                    <div class="card-body">

                        <canvas id="graficoFactores"></canvas>

                    </div>

                </div>

            </div>

        </div>

        <div class="row mt-4">

            <div class="col-lg-6">

                <div class="card">

                    <div class="card-header">
                        Desregulaciones por Día
                    </div>

                    <div class="card-body">

                        <canvas id="graficoDias"></canvas>

                    </div>

                </div>

            </div>

            <div class="col-lg-6">

                <div class="card">

                    <div class="card-header">
                        Comparación por Curso
                    </div>

                    <div class="card-body">

                        <canvas id="graficoCursos"></canvas>

                    </div>

                </div>

            </div>

        </div>

<div class="mt-4 text-end">
<div class="card mt-4">

    <div class="card-header">
        Exportar Reportes
    </div>

    <div class="card-body text-end">

        <button id="btnPdf" class="btn btn-danger">
            <i class="bi bi-file-earmark-pdf"></i>
            Descargar PDF
        </button>

    </div>

</div>



    </main>

</div>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="reportes.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="sidebar.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>


</body>
</html>
