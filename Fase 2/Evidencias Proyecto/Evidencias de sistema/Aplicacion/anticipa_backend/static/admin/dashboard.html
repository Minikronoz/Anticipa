<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Anticipa Admin</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="styles.css">
</head>

<body class="bg-light">

    <!-- NAVBAR -->

    <nav class="navbar navbar-dark shadow" style="background-color:#061A40;">
        <div class="container-fluid px-4">

            <span class="navbar-brand fw-bold">
                🧩 Anticipa - Panel Administrativo
            </span>

            <button class="btn btn-outline-light" onclick="logout()">
                Cerrar sesión
            </button>

        </div>
    </nav>

    <!-- CONTENIDO -->

    <div class="container-fluid mt-4 px-4">

        <!-- MÉTRICAS -->

        <div class="row g-3 mb-4">

            <div class="col-md-3">
                <div class="card border-0 shadow-sm">
                    <div class="card-body text-center">
                        <h2 id="totalUsuarios">0</h2>
                        <p class="mb-0">Usuarios Totales</p>
                    </div>
                </div>
            </div>

            <div class="col-md-3">
                <div class="card border-0 shadow-sm">
                    <div class="card-body text-center">
                        <h2 id="totalEstudiantes">0</h2>
                        <p class="mb-0">Estudiantes</p>
                    </div>
                </div>
            </div>

            <div class="col-md-3">
                <div class="card border-0 shadow-sm">
                    <div class="card-body text-center">
                        <h2 id="totalProfesores">0</h2>
                        <p class="mb-0">Profesores</p>
                    </div>
                </div>
            </div>

            <div class="col-md-3">
                <div class="card border-0 shadow-sm">
                    <div class="card-body text-center">
                        <h2 id="totalTutores">0</h2>
                        <p class="mb-0">Tutores</p>
                    </div>
                </div>
            </div>

        </div>

        <!-- MÉTRICAS EXTRA -->

        <div class="row g-3 mb-4">

            <div class="col-md-6">
                <div class="card border-0 shadow-sm">
                    <div class="card-body text-center">
                        <h2 id="totalAdmins">0</h2>
                        <p class="mb-0">Administradores</p>
                    </div>
                </div>
            </div>

            <div class="col-md-6">
                <div class="card border-0 shadow-sm">
                    <div class="card-body text-center">
                        <h2 id="desregulaciones">0</h2>
                        <p class="mb-0">Desregulaciones Registradas</p>
                    </div>
                </div>
            </div>

        </div>

        <!-- TABLA USUARIOS -->

        <div class="card border-0 shadow-sm mb-4">

            <div class="card-header bg-white">

                <div class="row align-items-center">

                    <div class="col-md-6">
                        <h4 class="mb-0">
                            Gestión de Usuarios
                        </h4>
                    </div>

                    <div class="col-md-6">

                        <input
                            type="text"
                            id="buscar"
                            class="form-control"
                            placeholder="Buscar por nombre o email..."
                            oninput="filtrarUsuarios()">

                    </div>

                </div>

            </div>

            <div class="card-body">

                <div class="table-responsive">

                    <table class="table table-hover table-bordered align-middle">

                        <thead class="table-light">

                            <tr>
                                <th>ID</th>
                                <th>Nombre</th>
                                <th>Email</th>
                                <th>Rol</th>
                                <th>Admin</th>
                                <th>Curso</th>
                                <th>Acciones</th>
                            </tr>

                        </thead>

                        <tbody id="tablaUsuarios"></tbody>

                    </table>

                </div>

            </div>

        </div>

        <!-- GRÁFICOS -->

        <div class="row g-3">

            <div class="col-lg-6">

                <div class="card border-0 shadow-sm">

                    <div class="card-header bg-white">
                        Distribución de Usuarios
                    </div>

                    <div class="card-body text-center">

                        <canvas id="graficoRoles" height="250"></canvas>

                    </div>

                </div>

            </div>

            <div class="col-lg-6">

                <div class="card border-0 shadow-sm">

                    <div class="card-header bg-white">
                        Comportamiento Estudiantil
                    </div>

                    <div class="card-body text-center">

                        <canvas id="graficoDesregulacion" height="250"></canvas>

                    </div>

                </div>

            </div>

        </div>

    </div>

    <!-- MODAL EDITAR -->

    <div class="modal fade" id="modalEditar" tabindex="-1">

        <div class="modal-dialog">

            <div class="modal-content">

                <div class="modal-header">

                    <h5 class="modal-title">
                        Editar Usuario
                    </h5>

                    <button
                        type="button"
                        class="btn-close"
                        data-bs-dismiss="modal">
                    </button>

                </div>

                <div class="modal-body">

                    <input type="hidden" id="editId">

                    <div class="mb-3">

                        <label class="form-label">
                            Nombre
                        </label>

                        <input
                            type="text"
                            id="editNombre"
                            class="form-control">

                    </div>

                    <div class="mb-3">

                        <label class="form-label">
                            Email
                        </label>

                        <input
                            type="email"
                            id="editEmail"
                            class="form-control">

                    </div>

                    <div class="mb-3">

                        <label class="form-label">
                            Rol
                        </label>

                        <input
                            type="number"
                            id="editRol"
                            class="form-control">

                    </div>

                    <div class="form-check mb-3">

                        <input
                            type="checkbox"
                            id="editAdmin"
                            class="form-check-input">

                        <label class="form-check-label">
                            Es administrador
                        </label>

                    </div>

                    <div class="mb-3">

                        <label class="form-label">
                            Nueva contraseña
                        </label>

                        <input
                            type="password"
                            id="editPassword"
                            class="form-control">

                    </div>

                </div>

                <div class="modal-footer">

                    <button
                        type="button"
                        class="btn btn-secondary"
                        data-bs-dismiss="modal">
                        Cancelar
                    </button>

                    <button
                        type="button"
                        class="btn btn-primary"
                        onclick="guardarUsuario()">
                        Guardar Cambios
                    </button>

                </div>

            </div>

        </div>

    </div>

    <!-- LIBRERÍAS -->

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <script src="app.js"></script>

</body>

</html>
